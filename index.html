<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sander Tamm - Full-Stack Developer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #161616;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 60px 20px;
        }

        .header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        .song{
            display: flex;
            align-items: center;
        }

        #status {
            margin-right: 10px;
        }

        #status {
            color: #1ED760;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Sander Tamm</h1>
        <p id="dev">full-stack developer</p>
    </div>
    <br>
    <div class="song">
        <h2 id="status"></h2>
        <h2 id="song-title"></h2>
    </div>
    <script>
        const API_KEY = '4d288c1c7310848430dd818561af10c7';
        const USER = 'TheBighi';

        fetch(
        `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USER}&api_key=${API_KEY}&format=json&limit=1`
        )
        .then(res => res.json())
        .then(data => {
            const track = data.recenttracks.track[0];
            console.log({
            song: track.name,
            nowPlaying: track['@attr']?.nowplaying === 'true',
            });

            document.getElementById('status').textContent = track['@attr']?.nowplaying === 'true' ? 'Now Playing:' : 'Last Played:';
            document.getElementById('song-title').textContent = track.name;
        });
    </script>
</body>
</html>
